services:
  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      # Override DATABASE_URL to point at the persistent volume mount.
      DATABASE_URL: sqlite:////data/hiring_sim.db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - hiring_sim_db:/data
      # Hot-reload during dev: mount source so uvicorn --reload picks up edits.
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    env_file: .env
    environment:
      # Use the Docker service name so the Vite proxy can reach the backend
      # container internally (localhost doesn't resolve to the backend in Docker).
      BACKEND_URL: http://backend:8000
      # Empty so the frontend uses relative URLs → goes through the Vite proxy
      # instead of making cross-origin requests directly from the browser.
      VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend

volumes:
  hiring_sim_db:
